<!DOCTYPE html>
<html lang="en">
<head>
    <title>WebSocket</title>
</head>
<body>

<h2>WebSocket</h2>
<p><input type="button" value="Create" onclick="createRoom()"></p>
<p><label id="lbl">lbl</label></p>
<p><input type="button" value="Connect" onclick="connectToRoom()"></p>
<p><label id="lbl2">lbl2</label></p>

<script>
    function createRoom() {
        let socket = new WebSocket("ws://localhost:8080/createRoom?username=Homer");
        console.log("Attempting Connection...");

        socket.onmessage = message => {
            document.getElementById("lbl").innerHTML = message.data.toString()
            console.log("New message: ", message);
        };

        socket.onclose = event => {
            console.log("Socket Closed Connection: ", event);
        };

        socket.onerror = error => {
            document.getElementById("lbl").innerHTML = error.type.toString()
            console.log("Socket Error: ", error);
        };

        socket.onopen = () => {
            console.log("Successfully Connected");
        };
    }

    function connectToRoom() {
        let socket = new WebSocket("ws://localhost:8080/connectToRoom?username=Bart");
        console.log("Attempting Connection...");

        socket.onmessage = message => {
            document.getElementById("lbl2").innerHTML = message.data.toString()
            console.log("New message: ", message);
        };

        socket.onclose = event => {
            console.log("Socket Closed Connection: ", event);
        };

        socket.onerror = error => {
            document.getElementById("lbl2").innerHTML = error.type.toString()
            console.log("Socket Error: ", error);
        };

        socket.onopen = () => {
            console.log("Successfully Connected");
        };
    }
</script>

</body>
</html>
