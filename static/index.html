<!DOCTYPE html>
<html lang="en">
<head>
    <title>WebSocket</title>
</head>
<body>

<h2>WebSocket</h2>
<p><input type="button" value="Create" onclick="createRoom()"></p>
<p><label id="lbl"></label></p>

<script>
    let socket = new WebSocket("ws://localhost:8080/createRoom?roomId=qwerty123");
    console.log("Attempting Connection...");

    socket.onmessage = message => {
        document.getElementById("lbl").innerHTML = message.data.toString()
        console.log("New message: ", message);
        socket.send("Got it!")
    }

    socket.onclose = event => {
        console.log("Socket Closed Connection: ", event);
    };

    socket.onerror = error => {
        console.log("Socket Error: ", error);
    };

    socket.onopen = () => {
        console.log("Successfully Connected");
    };

    const sleep = ms => new Promise(res => setTimeout(res, ms))

    async function createRoom() {
        for (let i = 0; i < 100; i++) {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send("What time is it?")
                await sleep(2000)
            } else {
                return
            }
        }
    }
</script>

</body>
</html>
