version: '2.7'

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ws-chat_app
    environment:
      REDIS_ADDR: 'redis:6379'
    ports:
      - '8080:8080'
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:6.2-alpine3.14
    container_name: ws-chat_redis
    ports:
      - '6379:6379'
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 5s
      timeout: 10s
      retries: 10
